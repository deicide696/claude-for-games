    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}

const C = {
  hierba: hx('#3d7a3c'), hierbaOsc: hx('#285a2e'), tierra: hx('#5b4130'), tierraOsc: hx('#3a2a1f'),
  piedra: hx('#80868e'), piedraOsc: hx('#545a62'), musgo: hx('#4e7e3c'), empedrado: hx('#8d8c86'),

  blanco: [1, 1, 1], caldero: hx('#2b2b33'),
  puca: hx('#221c2e'), pucaClaro: hx('#3a3248'), pucaOjo: hx('#ffcf3a'), cola: hx('#ddd6ea'),

};

// =====================================================================
// MATEMÁTICA 3D (matrices 4x4 por columnas, como las usa WebGL)
// =====================================================================
function m4() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; }
function m4Mul(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let f = 0; f < 4; f++)
    o[c * 4 + f] = a[f] * b[c * 4] + a[4 + f] * b[c * 4 + 1] + a[8 + f] * b[c * 4 + 2] + a[12 + f] * b[c * 4 + 3];
  return o;
}
function mT(m, x, y, z) { for (let i = 0; i < 4; i++) m[12 + i] += m[i] * x + m[4 + i] * y + m[8 + i] * z; return m; }
function mS(m, x, y, z) { for (let i = 0; i < 4; i++) { m[i] *= x; m[4 + i] *= y; m[8 + i] *= z; } return m; }
function mRX(m, a) { const c = Math.cos(a), s = Math.sin(a); for (let i = 0; i < 4; i++) { const p = m[4 + i], q = m[8 + i]; m[4 + i] = p * c + q * s; m[8 + i] = q * c - p * s; } return m; }
function mRY(m, a) { const c = Math.cos(a), s = Math.sin(a); for (let i = 0; i < 4; i++) { const p = m[i], q = m[8 + i]; m[i] = p * c - q * s; m[8 + i] = p * s + q * c; } return m; }
function mRZ(m, a) { const c = Math.cos(a), s = Math.sin(a); for (let i = 0; i < 4; i++) { const p = m[i], q = m[4 + i]; m[i] = p * c + q * s; m[4 + i] = q * c - p * s; } return m; }
// mat(): posición, giro en Y, escala, y giros opcionales en X y Z
function mat(x = 0, y = 0, z = 0, ry = 0, sx = 1, sy = sx, sz = sx, rx = 0, rz = 0) {
  const m = m4(); mT(m, x, y, z);
  if (ry) mRY(m, ry); if (rx) mRX(m, rx); if (rz) mRZ(m, rz);
  if (sx !== 1 || sy !== 1 || sz !== 1) mS(m, sx, sy, sz);
  return m;
}
function perspectiva(fov, asp, n, f) {
  const t = 1 / Math.tan(fov / 2), m = new Float32Array(16);
  m[0] = t / asp; m[5] = t; m[10] = (f + n) / (n - f); m[11] = -1; m[14] = 2 * f * n / (n - f);
  return m;
}
function norm3(v) { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
function cruz(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function mirar(ojo, obj) {
  const f = norm3([obj[0] - ojo[0], obj[1] - ojo[1], obj[2] - ojo[2]]);
  const r = norm3(cruz(f, [0, 1, 0])), u = cruz(r, f);
  const m = new Float32Array(16);
  m[0] = r[0]; m[4] = r[1]; m[8] = r[2];
  m[1] = u[0]; m[5] = u[1]; m[9] = u[2];
  m[2] = -f[0]; m[6] = -f[1]; m[10] = -f[2];
  m[12] = -(r[0] * ojo[0] + r[1] * ojo[1] + r[2] * ojo[2]);
  m[13] = -(u[0] * ojo[0] + u[1] * ojo[1] + u[2] * ojo[2]);
  m[14] = f[0] * ojo[0] + f[1] * ojo[1] + f[2] * ojo[2];
  m[15] = 1;
  return { m, f, r, u };
}
// Matriz de normales (inversa traspuesta de la parte 3x3)
function normalDe(m, o) {
  const x0 = m[0], y0 = m[1], z0 = m[2], x1 = m[4], y1 = m[5], z1 = m[6], x2 = m[8], y2 = m[9], z2 = m[10];
  const a0 = y1 * z2 - z1 * y2, a1 = z1 * x2 - x1 * z2, a2 = x1 * y2 - y1 * x2;
  const b0 = y2 * z0 - z2 * y0, b1 = z2 * x0 - x2 * z0, b2 = x2 * y0 - y2 * x0;
  const c0 = y0 * z1 - z0 * y1, c1 = z0 * x1 - x0 * z1, c2 = x0 * y1 - y0 * x1;

const lienzo = document.getElementById('gl');
const gl = lienzo.getContext('webgl', { antialias: true, alpha: false, stencil: true });
const hudL = document.getElementById('hud');

function ajustar() {
  DPR = Math.min(window.devicePixelRatio || 1, RESOLUCION_MAX);
  W = innerWidth; H = innerHeight;
  lienzo.width = Math.round(W * DPR); lienzo.height = Math.round(H * DPR);

const VS_PRINCIPAL = `
attribute vec3 aPos; attribute vec3 aNor; attribute vec3 aCol;
uniform mat4 uVP; uniform mat4 uModel; uniform mat3 uNorM;
uniform float uTiempo; uniform float uOnda;
uniform vec4 uBal; uniform vec4 uBalB;
varying vec3 vPos; varying vec3 vNor; varying vec3 vCol;
void main() {
  vec3 p = aPos;
  // pelo, capa y capucha de AleUnda: se doblan más cuanto más lejos de su raíz (altura uBal.w);
  // uBal.xyz es lo que se desplaza la punta, uBalB.x el largo (negativo si crece hacia arriba), uBalB.y el aleteo
  if (uBalB.x != 0.0) {
    float k = clamp((uBal.w - p.y) / uBalB.x, 0.0, 1.0); k *= k;
    p += uBal.xyz * k;
    p.z -= sin(uTiempo * 11.0 - p.y * 9.0 + p.x * 5.0) * uBalB.y * k;
  }
  vec4 w = uModel * vec4(p, 1.0);
  if (uOnda > 0.5) w.y += sin(w.x * 0.7 + uTiempo * 1.3) * 0.05 + sin(w.z * 0.5 - uTiempo * 1.7) * 0.05;
  vPos = w.xyz; vNor = uNorM * aNor; vCol = aCol;
  gl_Position = uVP * w;
}`;
const FS_PRINCIPAL = `
precision highp float;
varying vec3 vPos; varying vec3 vNor; varying vec3 vCol;
uniform vec3 uCam; uniform vec3 uLuzDir; uniform vec3 uLuzCol; uniform vec3 uAmbArriba; uniform vec3 uAmbAbajo;
uniform vec3 uNiebla; uniform float uNieblaDens; uniform float uNieblaBaja;
uniform vec3 uTinte; uniform float uEmis; uniform float uAlfa; uniform vec3 uFlash;
uniform float uOnda; uniform float uTiempo;
uniform vec3 uLP[8]; uniform vec3 uLC[8];
uniform float uCerca;
float bayer2(vec2 a) { a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }
void main() {
  // lo que roza la cámara se desvanece con un tramado (así nunca llena la pantalla)
  float dCam = length(uCam - vPos);
  if (dCam < uCerca && bayer2(gl_FragCoord.xy * 0.5) * 0.25 + bayer2(gl_FragCoord.xy) >= smoothstep(uCerca * 0.35, uCerca, dCam)) discard;
  vec3 n = normalize(vNor);
  if (!gl_FrontFacing) n = -n;
  vec3 base = vCol * uTinte;
  vec3 V = normalize(uCam - vPos);
  float d = max(dot(n, uLuzDir), 0.0);
  d = mix(d, smoothstep(0.2, 0.3, d) * 0.75 + d * 0.25, 0.5);
  vec3 luz = mix(uAmbAbajo, uAmbArriba, n.y * 0.5 + 0.5) + uLuzCol * d;
  for (int i = 0; i < 8; i++) {
    vec3 L = uLP[i] - vPos;
    float d2 = dot(L, L);
    float at = 1.0 / (1.0 + d2 * 0.3);
    float nl = max(dot(n, L * inversesqrt(d2 + 0.0001)), 0.0) * 0.8 + 0.2;
    luz += uLC[i] * at * nl;
  }
  vec3 col = base * luz;
  col = mix(col, base, uEmis);
  if (uOnda > 0.5) {
    float s = sin(vPos.x * 1.7 + uTiempo * 1.9) * sin(vPos.z * 1.3 - uTiempo * 1.4);
    col += vec3(0.10, 0.24, 0.30) * smoothstep(0.55, 1.0, s);

});
let padAntes = [], ejeAntes = { x: 0, y: 0 };
const NADA = { x: 0, z: 0, salto: false, correr: false, saltoP: false, giroP: false, okP: false, pausaP: false, nuevaP: false, mapaP: false, bolsaP: false, atrasP: false, vestirP: false, derP: false, izqP: false, arrP: false, abaP: false };
function leerEntrada() {
  const k = teclas, p = (...cs) => cs.some(c => pulsadas[c]);
  const e = {
    x: (k.ArrowRight || k.KeyD ? 1 : 0) - (k.ArrowLeft || k.KeyA ? 1 : 0),
    z: (k.ArrowUp || k.KeyW ? 1 : 0) - (k.ArrowDown || k.KeyS ? 1 : 0),
    salto: !!(k.Space || k.KeyK || k.KeyZ),
    correr: !!(k.ShiftLeft || k.ShiftRight || k.KeyL),
    saltoP: p('Space', 'KeyK', 'KeyZ'),
    giroP: p('KeyJ', 'KeyX'),
    okP: p('Enter', 'NumpadEnter', 'Space'),
    pausaP: p('Escape', 'KeyP', 'Enter', 'NumpadEnter'),
    nuevaP: p('KeyN'), mapaP: p('KeyM'), bolsaP: p('KeyB', 'KeyI'), atrasP: p('Escape'), vestirP: p('KeyV'),
    derP: p('ArrowRight', 'KeyD'), izqP: p('ArrowLeft', 'KeyA'), arrP: p('ArrowUp', 'KeyW'), abaP: p('ArrowDown', 'KeyS'),
  };
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const g of pads) {
    if (!g) continue;
    const b = i => !!(g.buttons[i] && g.buttons[i].pressed), bp = i => b(i) && !padAntes[i];
    let ax = g.axes[0] || 0, ay = g.axes[1] || 0;
    if (Math.hypot(ax, ay) < 0.2) { ax = 0; ay = 0; }
    if (b(14)) ax = -1; if (b(15)) ax = 1; if (b(12)) ay = -1; if (b(13)) ay = 1;
    if (ax || ay) { e.x = ax; e.z = -ay; }
    if (b(0)) e.salto = true;
    if (b(5) || b(7)) e.correr = true;
    if (bp(0)) { e.saltoP = true; e.okP = true; }
    if (bp(2) || bp(1)) e.giroP = true;
    if (bp(9)) { e.pausaP = true; e.okP = true; }
    if (bp(8)) e.mapaP = true;
    if (bp(3)) e.bolsaP = true;
    if (bp(4)) e.vestirP = true;
    if (ax > 0.6 && ejeAntes.x <= 0.6) e.derP = true;
    if (ax < -0.6 && ejeAntes.x >= -0.6) e.izqP = true;
    if (ay < -0.6 && ejeAntes.y >= -0.6) e.arrP = true;
    if (ay > 0.6 && ejeAntes.y <= 0.6) e.abaP = true;
    ejeAntes = { x: ax, y: ay };
    padAntes = g.buttons.map(x => x.pressed);
    break;
  }
  return e;
}

const sesion = { vidas: VIDAS_INICIALES, setas: 0, puntos: 0, corazones: CORAZONES_MAX, corazonesMax: CORAZONES_MAX, nivel: 0, control: null, objeto: null };
function reiniciarSesion() { sesion.vidas = VIDAS_INICIALES; sesion.setas = 0; sesion.puntos = 0; sesion.control = null; sesion.objeto = null; }

// =====================================================================
// DECORADO (piezas que se pintan en la malla fija de un nivel o del mapa)
// =====================================================================
function arbolEn(D, x, z, yBase, yCopa, esc) {
  const r = 0.55 * esc;
  D.cilindro(mat(x, yBase, z, rnd(0, 6), r * 1.3, yCopa - yBase, r * 1.3), jit(C.corteza, 0.15), 7, 0.62, C.corteza, 0.12);
  if (yBase > -5) for (let k = 0; k < 4; k++) {
    const a = rnd(0, TAU);
    D.cilindro(mat(x + Math.cos(a) * r * 0.8, yBase - 0.05, z + Math.sin(a) * r * 0.8, 0, r * 0.45, r * 1.3, r * 0.45, Math.sin(a) * 0.9, -Math.cos(a) * 0.9), C.corteza, 5, 0.1);
  }
  for (let k = 0; k < 2; k++) {
    const a = rnd(0, TAU);
    D.cilindro(mat(x, yCopa - rnd(0.6, 1.4) * esc, z, 0, r * 0.38, 2 * esc, r * 0.38, Math.sin(a), -Math.cos(a)), C.corteza, 5, 0.4);
  }
  for (let k = 0; k < 5; k++) {
    const a = k / 5 * TAU + rnd(0, 1), rr = k === 0 ? 0 : rnd(1.0, 1.7) * esc, s = rnd(1.5, 2.2) * esc;
    D.esfera(mat(x + Math.cos(a) * rr, yCopa + rnd(0.3, 1.2) * esc + (k === 0 ? 0.9 * esc : 0), z + Math.sin(a) * rr, rnd(0, 6), s, s * 0.8, s),
      jit([C.hoja, C.hojaClara, C.hojaOsc][k % 3], 0.15), 7, 5, { ruido: 0.28, vari: 0.12 });
  }
}
function menhirEn(D, x, z, y, alto) {
  const r = rnd(0.42, 0.55);
  D.cilindro(mat(x, y - 0.3, z, rnd(0, 6), r, alto + 0.3, r * 0.8, rnd(-0.07, 0.07), rnd(-0.07, 0.07)), jit(C.piedra, 0.12), 5, 0.6, C.musgo, 0.12);
  return r;
}
function dolmenEn(D, E, x, z, y, esc = 1) {
  for (const s of [-1, 1]) D.caja(mat(x + s * 1.2 * esc, y + 1.1 * esc, z, 0, 0.7 * esc, 2.2 * esc, 0.8 * esc), jit(C.piedra, 0.1), C.musgo, 0.12);
  D.caja(mat(x, y + 2.5 * esc, z, 0, 3.4 * esc, 0.6 * esc, 1.7 * esc), jit(C.piedraOsc, 0.1), C.musgo, 0.12);
  E.caja(mat(x, y + 2.5 * esc, z + 0.86 * esc, 0, 1.6 * esc, 0.06 * esc, 0.02), C.runa);
  E.caja(mat(x, y + 2.5 * esc, z + 0.86 * esc, 0, 0.06 * esc, 0.4 * esc, 0.02), C.runa);
}
function setasDecoEn(D, E, x, z, y, n = 5) {
  const col = azar() < 0.5 ? C.setaAzul : C.setaViol;
  for (let i = 0; i < n; i++) {
    const xx = x + rnd(-0.7, 0.7), zz = z + rnd(-0.7, 0.7), s = rnd(0.5, 1.3);
    D.cilindro(mat(xx, y, zz, 0, 0.07 * s, 0.35 * s, 0.07 * s), C.setaTallo, 6, 0.8);
    E.esfera(mat(xx, y + 0.33 * s, zz, 0, 0.2 * s, 0.13 * s, 0.2 * s), col, 8, 6, { mitad: true, colAbajo: escCol(col, 0.6) });
  }
  return col;
}
function hierbaEn(D, x, z, y) {
  for (let k = 0; k < 3; k++)
    D.cilindro(mat(x + rnd(-0.12, 0.12), y, z + rnd(-0.12, 0.12), 0, 0.05, rnd(0.25, 0.5), 0.05, rnd(-0.3, 0.3), rnd(-0.3, 0.3)), jit(C.hierbaOsc, 0.3), 3, 0);
}
function florEn(D, E, x, z, y) {
  const hh = rnd(0.2, 0.4);
  D.cilindro(mat(x, y, z, 0, 0.02, hh, 0.02), C.hierbaOsc, 3, 1);
  E.esfera(mat(x, y + hh, z, 0, 0.06), [C.flor1, C.flor2, C.flor3][Math.floor(azar() * 3)], 5, 3);
}
function helechoEn(D, x, z, y) {
  const a0 = rnd(0, TAU);
  for (let k = 0; k < 5; k++) { const a = a0 + k * TAU / 5; D.caja(mat(x + Math.cos(a) * 0.2, y + 0.12, z + Math.sin(a) * 0.2, -a, 0.45, 0.03, 0.12, 0, 0.45), jit(C.hojaClara, 0.25)); }
}
function rocaEn(D, x, z, y, r) { D.esfera(mat(x, y, z, rnd(0, 6), r, r * 0.6, r * rnd(0.8, 1.1)), jit(C.piedra, 0.2), 6, 4, { ruido: 0.3 }); }

// Malla de una plataforma que se mueve o se cae (arriba en y=0, centrada)
function mallaPlataforma(estilo, w, l, hh) {
  return hacer(M => {
    if (estilo === 'tronco') {
      const largo = Math.max(w, l), r = Math.min(w, l) / 2;
      const giro = w >= l ? mat(-w / 2, -r, 0, 0, r, largo, r, 0, -Math.PI / 2) : mat(0, -r, l / 2, 0, r, largo, r, -Math.PI / 2);
      M.cilindro(giro, C.corteza, 9, 1, C.cortezaClara, 0.12);
      for (let i = 0; i < 3; i++) setasDecoEn(M, M, (w >= l ? rnd(-w / 3, w / 3) : 0) + (w >= l ? 0 : rnd(-0.2, 0.2)), (w >= l ? rnd(-0.2, 0.2) : rnd(-l / 3, l / 3)), -0.05, 1);
    } else if (estilo === 'hoja') {
      M.esfera(mat(0, -0.08, 0, 0.3, w / 2 * 1.05, 0.12, l / 2 * 1.1), C.hojaSeca, 12, 6, { vari: 0.15 });
      M.caja(mat(0, 0.0, 0, 0.3, 0.06, 0.03, l * 0.95), escCol(C.hojaSeca, 0.7));
    } else if (estilo === 'cesta') {
      M.cilindro(mat(0, -0.7, 0, 0, w / 2, 0.7, l / 2), C.cesta, 10, 1.1, hx('#5e4428'), 0.15);
      M.cilindro(mat(0, -0.08, 0, 0, w / 2 * 1.12, 0.1, l / 2 * 1.12), hx('#7a5a34'), 10, 1);
      for (const s of [-1, 1]) M.cilindro(mat(s * w / 2 * 0.9, 0, 0, 0, 0.03, 12, 0.03), hx('#b8a07a'), 4, 1);
    } else if (estilo === 'piedra') {
      M.caja(mat(0, -hh / 2, 0, 0, w, hh, l), C.piedraOsc, C.piedra, 0.15);
      M.cilindro(mat(0, -hh + 0.02, 0, rnd(0, 6), w * 0.35, 1.3, l * 0.35, Math.PI), C.piedraOsc, 6, 0.15);
      M.caja(mat(0.1, 0.005, 0, 0.6, 0.05, 0.01, l * 0.8), hx('#3a3e44'));
    } else if (estilo === 'madera') {
      M.caja(mat(0, -hh / 2, 0, 0, w, hh, l), hx('#6b4d33'), hx('#8a6a46'), 0.15);
      for (let i = 0; i < 3; i++) M.caja(mat(-w / 2 + (i + 0.5) * w / 3, 0.005, 0, 0, 0.04, 0.01, l * 0.96), hx('#4a3424'));
    } else { // losa de piedra flotante con runas
      M.caja(mat(0, -hh / 2, 0, 0, w, hh, l), C.piedra, C.musgo, 0.12);
      M.cilindro(mat(0, -hh + 0.02, 0, rnd(0, 6), w * 0.38, 1.4, l * 0.38, Math.PI), C.piedraOsc, 6, 0.15);
    }
  });
}

// =====================================================================
// CONSTRUCCIÓN DE NIVELES
// =====================================================================
let nivel = null;
function nuevoSolido(N, s) { s.activo = true; N.solidos.push(s); return s; }
function cajaSolida(N, x0, x1, y0, y1, z0, z1, extra) { return nuevoSolido(N, Object.assign({ tipo: 'caja', x0, x1, y0, y1, z0, z1 }, extra)); }
function cilSolido(N, x, z, r, y0, y1, extra) { return nuevoSolido(N, Object.assign({ tipo: 'cil', x, z, r, y0, y1 }, extra)); }
function colocarPlataforma(p) {
  const s = p.s;
  s.x0 = p.cx - p.w / 2; s.x1 = p.cx + p.w / 2; s.y0 = p.cy - p.h; s.y1 = p.cy; s.z0 = p.cz - p.l / 2; s.z1 = p.cz + p.l / 2;
}

function crearNivel(def, indice) {
  azar = semilla(def.semilla || 7);
  const N = {
    def, indice, t: 0, tiempo: def.tiempo, avisado: false,
    solidos: [], setas: [], pucas: [], fatuos: [], items: [], moviles: [], caes: [], runas: [], muelles: [],
    controles: [], trisqueles: [], faroles: [], brillosDeco: [], voladoras: [], ondas: [], carteles: [], caminos: [], plata: null,
    deco: new Malla(), emis: new Malla(), agua: null, meta: null, jefe: null, arena: null, granTrisquel: null,
    inicio: { x: 0, y: 0, z: 0 }, yMuerte: def.yMuerte ?? -9,
  };
  def.construir(constructorDe(N));
  N.malla = aGPU(N.deco); N.mallaEmis = aGPU(N.emis); N.deco = N.emis = null;
  if (N.agua) {
    const A = N.agua, largo = A.z1 - A.z0;
    N.mallaAgua = hacer(M => M.plano(mat(0, A.y, (A.z0 + A.z1) / 2, 0, 90, 1, largo), C.agua, 36, Math.ceil(largo / 2.5), 0.12));
  }
  return N;
}
function liberarNivel(N) {
  borrarMalla(N.malla); borrarMalla(N.mallaEmis); borrarMalla(N.mallaAgua);
  for (const p of N.moviles.concat(N.caes, N.caminos)) borrarMalla(p.malla);
}

// Las funciones del constructor usan "d" = distancia hacia delante (z = -d)
function constructorDe(N) {
  const D = N.deco, E = N.emis, Z = d => -d, L = {};

  function decorarSuelo(x0, x1, z0, z1, y, piedra) {
    for (const xb of [x0, x1]) for (let z = z0 + 0.6; z < z1 - 0.3; z += rnd(1.2, 2.6))
      rocaEn(D, xb + (xb === x0 ? 0.2 : -0.2) + rnd(-0.1, 0.1), z, y, rnd(0.18, 0.4));
    const area = (x1 - x0) * (z1 - z0);
    const mancha = piedra ? mezcla(C.empedrado, C.piedraOsc, 0.5) : mezcla(C.hierba, C.hierbaOsc, 0.4);
    for (let i = 0; i < area / 6; i++) {   // manchas de color en el suelo
      const x = rnd(x0 + 0.6, x1 - 0.6), z = rnd(z0 + 0.6, z1 - 0.6);
      D.caja(mat(x, y + 0.012, z, rnd(0, 3), rnd(0.6, 1.3), 0.02, rnd(0.6, 1.3)), jit(mancha, 0.12));
    }
    for (let i = 0; i < area / 5; i++) {
      const x = rnd(x0 + 0.3, x1 - 0.3), z = rnd(z0 + 0.3, z1 - 0.3), tipo = azar();
      if (piedra) { if (tipo < 0.35) hierbaEn(D, x, z, y); continue; }
      if (tipo < 0.5) hierbaEn(D, x, z, y);
      else if (tipo < 0.72) florEn(D, E, x, z, y);
      else if (tipo < 0.82) rocaEn(D, x, z, y, rnd(0.1, 0.2));
      else if (tipo < 0.95) helechoEn(D, x, z, y);
    }
  }
  function libre(x, z, R) {
    for (const s of N.solidos) {
      if (s.suelo) continue;
      if (s.tipo === 'caja') { const dx = Math.max(s.x0 - x, 0, x - s.x1), dz = Math.max(s.z0 - z, 0, z - s.z1); if (dx * dx + dz * dz < R * R) return false; }
      else if (Math.hypot(x - s.x, z - s.z) < R + s.r) return false;
    }
    for (const o of N.setas) if (Math.hypot(x - o.x, z - o.z) < R + 1) return false;
    for (const o of N.trisqueles) if (Math.hypot(x - o.x, z - o.z) < R + 1.5) return false;
    if (N.plata && Math.hypot(x - N.plata.x, z - N.plata.z) < R + 1.5) return false;
    return true;
  }
  function solidosDolmen(x, z, y, esc) {
    for (const s of [-1, 1]) { const cx = x + s * 1.2 * esc; cajaSolida(N, cx - 0.35 * esc, cx + 0.35 * esc, y, y + 2.2 * esc, z - 0.4 * esc, z + 0.4 * esc); }
    cajaSolida(N, x - 1.7 * esc, x + 1.7 * esc, y + 2.2 * esc, y + 2.8 * esc, z - 0.85 * esc, z + 0.85 * esc);
  }

  L.inicio = (x, d, y = 0) => { N.inicio = { x, y, z: Z(d) }; };

  // Camino de tierra con hierba (o empedrado), flotando sobre la niebla
  L.tierra = (x0, x1, d0, d1, y = 0, op = {}) => {
    const prof = op.prof ?? 3.5, z0 = Z(d1), z1 = Z(d0), w = x1 - x0, l = z1 - z0, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
    cajaSolida(N, x0, x1, y - prof, y, z0, z1, { suelo: true });
    const arriba = op.piedra ? C.empedrado : C.hierba, borde = op.piedra ? C.piedraOsc : C.hierbaOsc;
    D.caja(mat(cx, y - prof / 2 - 0.2, cz, 0, w - 0.1, prof - 0.4, l - 0.1), C.tierra, C.tierra, 0.12);
    D.caja(mat(cx, y - 0.22, cz, 0, w + 0.16, 0.44, l + 0.16), borde, arriba, 0.05);
    const n = Math.max(1, Math.round(l / 5));
    for (let i = 0; i < n; i++) {
      const zz = z0 + (i + 0.5) * l / n, r = Math.min(w * 0.42, l / n * 0.6);
      D.cilindro(mat(cx + rnd(-0.6, 0.6), y - prof + 0.1, zz, rnd(0, 6), r, rnd(3, 6), r * rnd(0.8, 1.1), Math.PI), C.tierraOsc, 7, 0.12, C.tierraOsc, 0.15);
    }
    if (op.deco !== false) decorarSuelo(x0, x1, z0, z1, y, op.piedra);
  };
  // Bloque de piedra sólido (escalones, muros); y es la base
  L.piedra = (x, y, d, w, hh, l) => {
    const z = Z(d);
    cajaSolida(N, x - w / 2, x + w / 2, y, y + hh, z - l / 2, z + l / 2);
    D.caja(mat(x, y + hh / 2, z, 0, w, hh, l), C.piedra, C.musgo, 0.12);
  };
  // Losa flotante (y es la base, mide 0.6 de alto)
  L.losa = (x, y, d, w, l) => {
    const z = Z(d);
    cajaSolida(N, x - w / 2, x + w / 2, y, y + 0.6, z - l / 2, z + l / 2);
    D.caja(mat(x, y + 0.3, z, 0, w, 0.6, l), C.piedra, C.musgo, 0.12);
    D.cilindro(mat(x, y + 0.02, z, rnd(0, 6), w * 0.38, rnd(1.2, 2), l * 0.38, Math.PI), C.piedraOsc, 6, 0.15, C.piedraOsc, 0.15);
  };
  // Columna de piedra (y es la altura de arriba)
  L.columna = (x, d, y = 0, r = 0.9) => {
    const z = Z(d);
    cilSolido(N, x, z, r, y - 8, y);
    D.cilindro(mat(x, y - 8, z, rnd(0, 6), r, 8, r), C.piedra, 9, 1, C.musgo, 0.12);
  };
  // Runa: bloque que se golpea desde abajo ('seta', 'setas', 'trebol', 'bellota').
  // Si es oculta no se ve ni se puede pisar hasta que alguien la golpea desde abajo.
  L.runa = (x, y, d, item = 'seta', oculta = false) => {
    const z = Z(d), r = { x, y, z, item, usada: false, golpe: 0, cuenta: 0, oculta };
    r.s = cajaSolida(N, x - 0.5, x + 0.5, y, y + 1, z - 0.5, z + 0.5, { runa: r, oculta });
    N.runas.push(r);
  };
  // Camino de hadas: losa invisible que aparece al acercarse (y es la base, mide 0.35 de alto)
  L.caminoHadas = (x, y, d, w = 2, l = 2) => {
    const z = Z(d);
    cajaSolida(N, x - w / 2, x + w / 2, y, y + 0.35, z - l / 2, z + l / 2, { hadas: true });
    const malla = hacer(M => {
      M.caja(mat(0, 0.175, 0, 0, w, 0.35, l), hx('#8fd8c0'), hx('#c8fff0'), 0.08);
      for (let k = 0; k < 3; k++) M.caja(mat(-w * 0.3 + k * w * 0.3, 0.36, 0, 0, 0.06, 0.02, l * 0.6), C.runaVerde);
    });
    N.caminos.push({ x, y, z, w, l, a: 0, visto: false, malla });
  };
  // Bellota de plata: una por nivel, escondida en una zona secreta
  L.bellotaPlata = (x, y, d) => { N.plata = { x, y, z: Z(d), tomada: false, ya: !!progreso.plata[N.indice] }; };
  // Plataforma que va y viene (ax/ay/ad: amplitud en cada eje)
  L.movil = op => {
    const w = op.w ?? 2.5, l = op.l ?? 2.5, hh = op.h ?? 0.6, z = Z(op.d);
    const p = { bx: op.x, by: op.y, bz: z, ax: op.ax || 0, ay: op.ay || 0, az: -(op.ad || 0), periodo: op.periodo || 3, fase: op.fase || 0, w, l, h: hh, cx: op.x, cy: op.y, cz: z };
    p.s = cajaSolida(N, 0, 0, 0, 0, 0, 0, { movil: p, dx: 0, dy: 0, dz: 0 });
    colocarPlataforma(p);
    p.malla = mallaPlataforma(op.estilo || 'losa', w, l, hh);
    N.moviles.push(p);
  };
  // Plataforma que se cae al pisarla
  L.cae = op => {
    const w = op.w ?? 2.2, l = op.l ?? 2.2, hh = op.h ?? 0.6, z = Z(op.d);
    const p = { bx: op.x, by: op.y, bz: z, w, l, h: hh, cx: op.x, cy: op.y, cz: z, estado: 'quieto', t: 0, vy: 0 };
    p.s = cajaSolida(N, 0, 0, 0, 0, 0, 0, { cae: p, dx: 0, dy: 0, dz: 0 });
    colocarPlataforma(p);
    p.malla = mallaPlataforma(op.estilo || 'madera', w, l, hh);
    N.caes.push(p);
  };
  // Seta gigante que hace rebotar muy alto
  L.muelle = (x, d, y = 0) => {
    const z = Z(d), m = { x, y, z, aplasta: 0 };
    m.s = cilSolido(N, x, z, 1.15, y, y + 1.5, { rebote: MUELLE_REBOTE, muelle: m });
    N.muelles.push(m);
  };
  // Púca que patrulla un rectángulo; modo 'emboscada' = escondido bajo tierra
  L.puca = (x, d, y, rango, modo = 'normal') => {
    const b = { x0: rango.x0, x1: rango.x1, z0: Z(rango.d1), z1: Z(rango.d0) };
    N.pucas.push({
      x, y, z: Z(d), b, modo, estado: modo === 'emboscada' ? 'oculto' : 'patrulla', dir: 1, ang: 0, salto: azar() * 4,
      persigue: 0, enfria: 0, tA: 0, vx: 0, vz: 0, vy: 0, vivo: true, emerge: 0, giro: 0,
      eje: (b.x1 - b.x0) >= (b.z1 - b.z0) ? 'x' : 'z',
    });
  };
  // Fuego fatuo: { tipo: 'circulo', x, y, d, r, vel } o { tipo: 'linea', a: [x,y,d], b: [x,y,d], periodo }
  L.fatuo = op => {
    const f = Object.assign({ fase: 0, vel: 1 }, op);
    if (op.tipo === 'circulo') f.z = Z(op.d);
    else { f.a = [op.a[0], op.a[1], Z(op.a[2])]; f.b = [op.b[0], op.b[1], Z(op.b[2])]; }
    f.pos = [0, 0, 0];
    N.fatuos.push(f);
  };
  // Setas luminosas (y es la altura del centro de la seta)
  L.seta = (x, y, d) => { N.setas.push({ x, y, z: Z(d), tomada: false, fase: azar() * TAU }); };
  L.fila = (x0, d0, x1, d1, y, n) => { for (let i = 0; i < n; i++) { const t = n === 1 ? 0.5 : i / (n - 1); L.seta(lerp(x0, x1, t), y, lerp(d0, d1, t)); } };
  L.arco = (x0, d0, x1, d1, y, alto, n) => { for (let i = 0; i < n; i++) { const t = i / (n - 1); L.seta(lerp(x0, x1, t), y + Math.sin(t * Math.PI) * alto, lerp(d0, d1, t)); } };
  L.columnaSetas = (x, d, y0, y1, n) => { for (let i = 0; i < n; i++) L.seta(x, lerp(y0, y1, n === 1 ? 0 : i / (n - 1)), d); };
  // Anillo de hadas: setas en círculo y florecitas que brillan entre ellas
  L.anillo = (x, d, y, r, n) => {
    for (let i = 0; i < n; i++) { const a = i / n * TAU; L.seta(x + Math.cos(a) * r, y, d + Math.sin(a) * r); }
    for (let i = 0; i < n * 3; i++) {
      const a = (i + 0.5) / (n * 3) * TAU, xx = x + Math.cos(a) * r * rnd(0.92, 1.08), zz = Z(d + Math.sin(a) * r * rnd(0.92, 1.08));

}

  }
}

    if (p.roce) { const k = Math.exp(-p.roce * dt); p.vx *= k; p.vy *= k; p.vz *= k; }

  const dx = x - s.x, dz = z - s.z; return dx * dx + dz * dz <= s.r * s.r;

function crearJefe(x, y, z) {
  return { x, y: y + 20, z, y0: y, estado: 'dormido', t: 0, vida: JEFE_VIDA, ang: 0, desde: null, hacia: null, saltos: 0, flash: 0, sq: 0, activo: false, visible: false, angCarrera: 0, giro: 0 };

function actualizarJefe(dt) {
  const j = nivel.jefe, A = nivel.arena;
  j.t += dt; j.flash = Math.max(0, j.flash - dt * 3); j.sq = suave(j.sq, 0, 8, dt);
  const dx = ale.x - j.x, dz = ale.z - j.z, d = Math.hypot(dx, dz);
  const mirarAle = (k = 8) => { j.ang += angDif(j.ang, Math.atan2(dx, dz)) * (1 - Math.exp(-k * dt)); };
  const furia = JEFE_VIDA - j.vida;
  switch (j.estado) {
    case 'dormido':
      if (ale.estado === 'normal' && Math.hypot(ale.x - A.x, ale.z - A.z) < A.r - 2) {
        j.estado = 'aparece'; j.t = 0; j.visible = true; j.activo = true;
        pararMusica(0.3); sfx('puerta'); avisar('¡El Gran Púca!', 2.5);
      }
      break;
    case 'aparece': {
      const k = clamp(j.t / 1.0, 0, 1);
      j.y = lerp(j.y0 + 20, j.y0, k * k); mirarAle(20);
      if (k >= 1) {
        aterrizaJefe(); j.estado = 'ruge'; j.t = 0; sfx('rugido'); tocarMusica('jefe');
        if (!progreso.historia.includes('jefe')) iniciarDialogo('jefe');
      }
      break; }
    case 'ruge': mirarAle(); if (j.t > 1.3) { j.estado = 'espera'; j.t = 0; } break;
    case 'espera':
      mirarAle();
      if (j.t > 0.9 - furia * 0.2) { j.estado = 'agacha'; j.t = 0; j.saltos = 1 + furia; }
      break;
    case 'agacha': mirarAle(12); j.sq = 0.35; if (j.t > 0.45) saltaJefe(); break;
    case 'salto': {
      const dur = JEFE_SALTO_TIEMPO - furia * 0.15, u = clamp(j.t / dur, 0, 1);
      j.x = lerp(j.desde[0], j.hacia[0], u); j.z = lerp(j.desde[1], j.hacia[1], u);
      j.y = j.y0 + 4 * JEFE_SALTO_ALTURA * u * (1 - u);

        j.y = j.y0; aterrizaJefe(); j.saltos--;
        if (j.saltos > 0) { j.estado = 'agacha'; j.t = 0.2; } else { j.estado = 'aturdido'; j.t = 0; }
      }
      break; }
    case 'aturdido': if (j.t > JEFE_ATURDIDO) { j.estado = 'espera'; j.t = 0; } break;
    case 'golpeado':
      if (j.t > 0.7) {
        if (j.vida <= 0) { j.estado = 'derrotado'; j.t = 0; sfx('rugido'); pararMusica(0.5); }
        else { j.estado = 'carrera'; j.t = 0; j.angCarrera = Math.atan2(j.z - A.z, j.x - A.x); sfx('rugido'); }
      }
      break;
    case 'carrera': {
      j.angCarrera += dt * (1.1 + furia * 0.25);
      const R = A.r - 2.2, tx = A.x + Math.cos(j.angCarrera) * R, tz = A.z + Math.sin(j.angCarrera) * R;
      j.ang += angDif(j.ang, Math.atan2(tx - j.x, tz - j.z)) * (1 - Math.exp(-10 * dt));
      j.x = suave(j.x, tx, 6, dt); j.z = suave(j.z, tz, 6, dt);
      j.y = j.y0 + Math.abs(Math.sin(j.t * 10)) * 0.5;
      if (Math.random() < dt * 20) polvo(j.x, j.y0, j.z, 1, 2);
      if (j.t > JEFE_CARRERA) { j.estado = 'espera'; j.t = 0; j.y = j.y0; }
      break; }
    case 'derrotado':
      j.giro += dt * (4 + j.t * 6);
      if (Math.random() < dt * 30) estallido(j.x + alea(-1.5, 1.5), j.y + alea(0.5, 3), j.z + alea(-1.5, 1.5), 4, [0.75, 0.5, 1], 3);
      if (j.t > 2.2) {   // la corona se rompe y vuelve a ser una liebre blanca y buena
        j.estado = 'liberado'; j.t = 0; j.giro = 0; j.y = j.y0; sacudida = 0.5; sfx('impacto'); sfx('liberado');
        estallido(j.x, j.y + 1.5, j.z, 60, C.oroClaro, 7);
        estallido(j.x, j.y + 1, j.z, 30, [0.9, 0.95, 1], 4, { arriba: 2 });
        nivel.granTrisquel = { x: A.x, y: A.y + 1.8, z: A.z, t: 0 };
        avisar('¡El hechizo se rompió! Toma el Gran Trisquel', 3);
        luaDice('¡Lo liberaste! ¡Era bueno de verdad!', 3);
      }
      break;
    case 'liberado': {   // brinca feliz alrededor del centro de la arena
      const an = j.t * 0.9, tx = A.x + Math.cos(an) * 3.2, tz = A.z + 2.5 + Math.sin(an) * 2.2;
      j.ang += angDif(j.ang, Math.atan2(tx - j.x, tz - j.z)) * (1 - Math.exp(-8 * dt));
      j.x = suave(j.x, tx, 2.5, dt); j.z = suave(j.z, tz, 2.5, dt);
      j.y = j.y0 + Math.abs(Math.sin(j.t * 5)) * 0.55;
      break; }
  }
  // ondas expansivas: hay que saltarlas
  for (let i = nivel.ondas.length - 1; i >= 0; i--) {
    const o = nivel.ondas[i]; o.r += ONDA_VEL * dt;
    if (o.r > A.r + 1) { nivel.ondas.splice(i, 1); continue; }

    if (ale.y < o.y + 0.55 && Math.abs(da - o.r) < 0.45) herir(o.x, o.z);

  if (j.visible && ale.estado === 'normal' && j.estado !== 'derrotado' && j.estado !== 'aparece' && j.estado !== 'liberado') {
    const RJ = 1.7, HJ = 3.0;

}

    volumenMusica(0.3); tSilencio = 1.6;   // la música se aparta para que se oiga el tesoro
    luaDice('¡Un trisquel! Cada uno guarda un poquito de la luz del bosque.', 3.2, 'trisquel');
  }
  const pb = nivel.plata;
  if (pb && !pb.tomada && Math.hypot(pb.x - cx, pb.y - cy, pb.z - cz) < 1.2) tomarPlata(pb);
  for (const it of nivel.items) {
    if (it.tomado || it.fase === 'sube' || Math.hypot(it.x - cx, it.y - cy, it.z - cz) > 1.0) continue;
    it.tomado = true;
    if (it.tipo === 'trebol') {
      if (sesion.corazones < sesion.corazonesMax) { sesion.corazones++; flotante(it.x, it.y, it.z, '+1 trébol', '#8dffa8'); }
      else { sesion.puntos += 1000; flotante(it.x, it.y, it.z, '+1000'); }

  }
  for (const c of nivel.controles) {

    luaDice('Este menhir recordará tu camino.', 2.4, 'control');
  }
  const m = nivel.meta;
  if (m && !m.tocada && Math.hypot(m.x - a.x, m.z - a.z) < 1.15 && a.y < m.y + m.alto) { tocarMeta(); return; }
  const g = nivel.granTrisquel;
  if (g && Math.hypot(g.x - cx, g.y - cy, g.z - cz) < 1.8) { terminarMundo(); return; }
  for (const p of nivel.pucas) {

let escena = 'titulo', tEscena = 0, pausado = false, reloj = 0, pendSalto = false, pendGiro = false;
const fundido = { a: 1, dir: -1, accion: null };

}

function actualizarJuego(dt, e, libre) {

      if (Math.random() < dt * 4) {
        const x = ale.x + alea(-6, 6), y = ale.y + alea(4, 8), z = ale.z + alea(-6, 3);
        estallido(x, y, z, 26, [C.oroClaro, C.runaVerde, C.setaViol, C.runa][Math.floor(Math.random() * 4)], 4.5, { g: 3, vida: 1.5 });
      }
      if (!finalHablado && !dialogo && tEscena > 1.8) iniciarDialogo('final', () => { finalHablado = true; tPanelFinal = 0; });
      if (dialogo) actualizarDialogo(dt, ent);
      else if (finalHablado) { tPanelFinal += dt; if (tPanelFinal > 1.5 && ent.okP) cambiar(() => irAlMapa()); }
      break; }
    case 'gameover':
      if (tEscena > 1.5 && ent.okP) { reiniciarSesion(); cambiar(() => irAlMapa()); }
      break;
  }
  if (aviso) { aviso.t += dt; if (aviso.t > aviso.dur) aviso = null; }
  for (let i = flotantes.length - 1; i >= 0; i--) { flotantes[i].t += dt; if (flotantes[i].t > 1.1) flotantes.splice(i, 1); }
}
function render() {
  gl.viewport(0, 0, lienzo.width, lienzo.height);
  gl.clearColor(0.02, 0.03, 0.06, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  h.setTransform(1, 0, 0, 1, 0, 0); h.clearRect(0, 0, hudL.width, hudL.height);
  h.setTransform(DPR * UI, 0, 0, DPR * UI, 0, 0);
  if (escena === 'titulo' || escena === 'mapa') renderMapa();
  else if ((escena === 'juego' || escena === 'final') && nivel) renderNivel();
  if (escena === 'titulo') hudTitulo();
  else if (escena === 'mapa') hudMapa();
  else if (escena === 'intro') hudIntro();
  else if (escena === 'juego') { hudJuego(); if (pausado) hudPausa(); }
  else if (escena === 'final') hudFinal();
  else if (escena === 'gameover') hudFin();
  if (dialogo && escena !== 'intro') hudDialogo();
  if (destello > 0.01 && escena === 'juego') { h.fillStyle = `rgba(190,255,210,${destello * 0.45})`; h.fillRect(0, 0, VW, VH); }
  if (fundido.a > 0.001) { h.fillStyle = `rgba(3,5,10,${fundido.a})`; h.fillRect(0, 0, VW, VH); }
}
let ultimo = performance.now();
function bucle(ahora) {
  requestAnimationFrame(bucle);
  const dt = Math.min(0.05, Math.max(0, (ahora - ultimo) / 1000));
  ultimo = ahora;
  const e = leerEntrada();
  actualizar(dt, e);
  render();
  limpiarPulsadas();
}

cargarProgreso();
crearModelos();
construirMapa();
mapa.nodo = progreso.nodo;
reiniciarMapa();
gl.enable(gl.DEPTH_TEST);
tocarMusica('mapa');   // empieza a sonar con la primera tecla (los navegadores lo exigen)
requestAnimationFrame(bucle);
</script>
